        <h1>ThreatModelling.io - Free Online Threat Modelling Tool</h1>
        <p>ThreatModelling.io is a free, browser-based threat modelling tool for cyber security professionals. Create visual threat models for cloud and on-premises infrastructure with automatic threat detection using the STRIDE methodology and MITRE ATT&amp;CK framework.</p>

        <h2>What is Threat Modelling?</h2>
        <p>Threat modelling is a structured approach to identifying and prioritising security risks in a system. By mapping your architecture and data flows, you can proactively discover vulnerabilities before attackers do. ThreatModelling.io makes this process fast and visual — drag cloud services onto a canvas, connect them to represent data flows, and automatically receive a prioritised list of threats with recommended mitigations.</p>

        <h2>Supported Cloud Providers</h2>
        <ul>
          <li><strong>Amazon Web Services (AWS)</strong> — EC2, S3, RDS, Lambda, EKS, API Gateway, CloudFront, IAM, and more</li>
          <li><strong>Microsoft Azure</strong> — Virtual Machines, Blob Storage, Azure SQL, AKS, Azure Functions, and more</li>
          <li><strong>Google Cloud Platform (GCP)</strong> — Compute Engine, Cloud Storage, BigQuery, GKE, Cloud Run, and more</li>
          <li><strong>Self-hosted infrastructure</strong> — Kubernetes, Docker, PostgreSQL, Redis, Nginx, and more</li>
          <li><strong>SaaS providers</strong> — Common third-party integrations and external services</li>
        </ul>

        <h2>Features</h2>
        <ul>
          <li>Visual drag-and-drop threat modelling canvas</li>
          <li>Automatic threat identification using STRIDE methodology (Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege)</li>
          <li>MITRE ATT&amp;CK technique mappings for each identified threat</li>
          <li>Security controls and mitigations for every threat</li>
          <li>Risk scoring based on threat severity and data sensitivity</li>
          <li>Network zone and trust boundary modelling</li>
          <li>Attack path analysis and blast radius visualisation</li>
          <li>Export to JSON, PDF security reports, and Markdown documentation</li>
          <li>No signup required — start threat modelling immediately</li>
          <li>Privacy-first: all data stays in your browser, nothing sent to servers</li>
        </ul>
